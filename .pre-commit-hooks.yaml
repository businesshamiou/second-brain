- id: vault-check-secrets
  name: "Vault : contrôle de secrets"
  description: Refuses a commit containing a secret. Pinned cross-cutting mechanism (Decision 2026-08-24, D2/D7).
  entry: tools/check-secrets.sh
  language: script
  always_run: true
  pass_filenames: false
- id: vault-check-indexes-fresh
  name: "Vault : contrôle de fraîcheur des index"
  description: Refuses a commit where a staged .md leaves its index.md stale (entries, status, description). Never regenerates (Mission 089).
  entry: tools/check-indexes-fresh.sh
  language: script
  always_run: true
  pass_filenames: false
- id: vault-check-index-weight
  name: "Vault : contrôle de poids des index"
  description: Refuses a staged index of more than 8,000 bytes, and a line of the Mission register of more than 300 characters (Decision 2026-09-05-124647, Mission 140).
  entry: tools/check-index-weight.sh
  language: script
  always_run: true
  pass_filenames: false
- id: vault-check-links
  name: "Vault : contrôle de liens"
  description: Refuses a commit with a broken documentation link. Pinned cross-cutting mechanism (Decision 2026-08-24, D2/D7).
  entry: tools/check-links.sh
  language: script
  always_run: true
  pass_filenames: false
