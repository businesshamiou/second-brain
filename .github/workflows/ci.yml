name: Second Brain CI

# Mission 168, ticket 10. Windows and Ubuntu replay the installer on every
# push, chaining the main test (answers file, second pass at empty
# porcelain -- both asserted inside the same script) with the offline
# guardian suite and the secondary tests built by tickets 03-09. macOS runs
# on every push too: its minutes were billed x10 while the repository was
# private, and they are free now that it is public.
# A separate job plays the real, published install line from GitHub: the
# repository is public, so every job here runs on GitHub-hosted runners on
# each push.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows -- install.ps1, full suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # "Gardiens hors ligne" (spec, Testing Decisions): the native
      # .githooks/pre-commit suite (10 guardians) run against this exact
      # checkout, no staged diff needed for the tree-wide checks to be
      # meaningful. uv is required by one guardian (reciprocite, via `uv
      # run`) -- installed here only if the runner does not already have
      # it, from the same official script and pinned SHA-256 already
      # trusted by tools/prerequisites.lock.json (ticket 04), into a
      # scratch $RUNNER_TEMP directory -- never the runner's profile paths
      # that a real install would touch, matching every other test in this
      # repo's own safety discipline.
      - name: Guardians offline (session-preflight + .githooks/pre-commit)
        shell: powershell
        run: |
          if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvBin = Join-Path $env:RUNNER_TEMP "uv-bin"
            New-Item -ItemType Directory -Path $uvBin -Force | Out-Null
            $env:UV_UNMANAGED_INSTALL = $uvBin
            $env:UV_NO_MODIFY_PATH = '1'
            $env:UV_SYSTEM_CERTS = '1'
            $scriptPath = Join-Path $env:RUNNER_TEMP "install-uv.ps1"
            Invoke-WebRequest -Uri "https://astral.sh/uv/0.12.13/install.ps1" -OutFile $scriptPath -UseBasicParsing
            $hash = (Get-FileHash -Algorithm SHA256 -Path $scriptPath).Hash
            if ($hash -ne "6A749FE05B2617EDE62127832D6F4C37E7B406740C7BC0DC62FE77F5E5EBDB20") {
              throw "uv install script hash mismatch: $hash"
            }
            & powershell -NoProfile -ExecutionPolicy Bypass -File $scriptPath
            $env:Path = "$uvBin;$env:Path"
          }
          bash tools/session-preflight.sh
          bash .githooks/pre-commit

      # Mission 181: CI used to call the guardians directly, never through
      # Git, so hooks tracked without their execute bit ran for no
      # participant on macOS or Linux and nothing here noticed. This one
      # commits in a fresh clone, the way a participant does.
      - name: Main -- a participant's commit runs the guardians (through Git)
        shell: bash
        run: bash tests/test-githooks-run-on-commit.sh

      - name: Main -- participant path free of bash 4+ and GNU-only constructs
        shell: bash
        run: bash tests/test-participant-shell-portability.sh

      # Mission 181, step 6 resumed: a root holding `&` or a backslash
      # reached two guardians mangled by sed; this sandbox proves it no
      # longer does (the backslash half runs where a name can hold one).
      - name: Main -- guardians read paths holding & or a backslash intact
        shell: bash
        run: bash tests/test-guardian-path-special-chars.sh

      - name: Main install test -- answers file, second pass at empty porcelain
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-install-e2e.ps1

      - name: Main -- nominal flow shows no atelier vocabulary (T21)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-nominal-flow-no-atelier-vocabulary.ps1

      - name: Secondary -- resume after forced stop
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-questionnaire-resume.ps1

      - name: Secondary -- simulated network failure
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-questionnaire-network-failure.ps1

      - name: Secondary -- assistant generation (Ibrahim, rename)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-assistant-generation.ps1

      - name: Secondary -- web package README matches its own contents
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-web-package-readme-matches-contents.ps1

      - name: Secondary -- catalog key parity (fr/en/es)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-catalog-key-parity.ps1

      - name: Secondary -- third-party licenses
        shell: bash
        run: bash tests/test-third-party-licenses.sh

      # --tree-only: blocking, catches any NEW private-pattern leak in the
      # current checkout. The full history is checked separately below and
      # stays informational because it now doubles this one: the published
      # history was rebuilt from a single root on 2026-09-15 and carries no
      # private pattern, so both modes read the same content. Full mode
      # earns its place the day a pattern is committed and then removed
      # from the tree -- it would still see it, this step would not.
      - name: Secondary -- private patterns (P4), current tree
        shell: bash
        run: bash tools/check-private-patterns.sh --tree-only

      - name: Secondary -- private patterns (P4), full history (informational, doubles the blocking tree check)
        shell: bash
        continue-on-error: true
        run: bash tools/check-private-patterns.sh

      - name: Secondary -- update mode, no change
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-questionnaire-update-mode.ps1

      - name: Secondary -- project assistant and skills links
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-project-assistant-and-skills-links.ps1

      # continue-on-error: a real, pre-existing environment drift (named in
      # the Mission 168 ticket 07 report, S23, finding 1) makes this one
      # fail on any machine that already has a machine-wide Git install
      # under Program Files -- confirmed on the Executor's own dev box, and
      # GitHub's windows-latest image is documented to ship Git the same
      # way, so this is expected to reproduce on the real runner too. Not
      # this ticket's to fix (ticket 04's test, not ticket 10's workflow) --
      # kept informational rather than reworded into a false green.
      - name: Additional -- prerequisites auto-install (informational; known environment drift)
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-prerequisites-e2e.ps1

      # Vault-suite precedents (spec: "precedents existants a reutiliser"),
      # kept informational -- not literally named by this ticket's own
      # checklist, reused here for extra coverage rather than left unrun.
      - name: Additional -- Vault-suite precedents (informational)
        shell: bash
        continue-on-error: true
        run: |
          bash tests/standalone.sh
          bash tests/test-check-links-cross-repo.sh
          bash tests/test-check-links-code-block-scope.sh
          bash tests/test-link-graph-drone-view-empty-status-field.sh

  ubuntu:
    name: Ubuntu -- install.sh, full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guardians offline (session-preflight + .githooks/pre-commit)
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            UV_BIN="$RUNNER_TEMP/uv-bin"
            mkdir -p "$UV_BIN"
            export UV_UNMANAGED_INSTALL="$UV_BIN"
            export UV_NO_MODIFY_PATH=1
            export UV_SYSTEM_CERTS=1
            curl -fsSL -o "$RUNNER_TEMP/install-uv.sh" "https://astral.sh/uv/0.12.13/install.sh"
            HASH="$(sha256sum "$RUNNER_TEMP/install-uv.sh" | awk '{print $1}')"
            if [ "$HASH" != "e7265962d703f3ca66b3e90fae8fcdc6d4e4b587027e9479ccc29b25c3f68d4e" ]; then
              echo "REFUS : hash uv installer inattendu : $HASH" >&2
              exit 1
            fi
            sh "$RUNNER_TEMP/install-uv.sh"
            export PATH="$UV_BIN:$PATH"
          fi
          bash tools/session-preflight.sh
          bash .githooks/pre-commit

      # Mission 181: CI used to call the guardians directly, never through
      # Git, so hooks tracked without their execute bit ran for no
      # participant on macOS or Linux and nothing here noticed. This one
      # commits in a fresh clone, the way a participant does.
      - name: Main -- a participant's commit runs the guardians (through Git)
        run: bash tests/test-githooks-run-on-commit.sh

      - name: Main -- participant path free of bash 4+ and GNU-only constructs
        run: bash tests/test-participant-shell-portability.sh

      # Mission 181, step 6 resumed: a root holding `&` or a backslash
      # reached two guardians mangled by sed; this sandbox proves it no
      # longer does (the backslash half runs where a name can hold one).
      - name: Main -- guardians read paths holding & or a backslash intact
        run: bash tests/test-guardian-path-special-chars.sh

      - name: Main install test -- answers file, second pass at empty porcelain
        run: bash tests/test-install-e2e.sh

      - name: Main -- nominal flow shows no atelier vocabulary (T21)
        run: bash tests/test-nominal-flow-no-atelier-vocabulary.sh

      - name: Secondary -- third-party licenses
        run: bash tests/test-third-party-licenses.sh

      - name: Secondary -- private patterns (P4), current tree
        run: bash tools/check-private-patterns.sh --tree-only

      - name: Secondary -- private patterns (P4), full history (informational, doubles the blocking tree check)
        continue-on-error: true
        run: bash tools/check-private-patterns.sh

      - name: Additional -- Vault-suite precedents (informational)
        continue-on-error: true
        run: |
          bash tests/standalone.sh
          bash tests/test-check-links-cross-repo.sh
          bash tests/test-check-links-code-block-scope.sh
          bash tests/test-link-graph-drone-view-empty-status-field.sh

      # HYPOTHESIS (Mission 168 report, ticket 08 S24; Mission Validation 4
      # explicitly allows "indetermine, cause a nommer" on Linux): tickets
      # 03-09 only ever built these five checks as PowerShell scripts
      # driving install.ps1 -- there is no shell/install.sh equivalent.
      # ubuntu-latest ships pwsh (DECLARED, GitHub runner-images), so they
      # are chained here too, but install.ps1's own behaviour under pwsh on
      # genuine Linux (registry-free PATH handling, Windows-only cmdlets
      # such as Get-WinSystemLocale) has never been exercised anywhere --
      # this machine has neither a real Linux box nor WSL (measured absent,
      # same finding as ticket 08's report). Cause named; not this ticket's
      # gap to close by inventing untested behaviour.
      - name: Secondary (HYPOTHESIS, not locally verifiable) -- resume, network failure, Ibrahim, catalogues, update mode, skills, prerequisites via pwsh
        shell: pwsh
        continue-on-error: true
        run: |
          pwsh -NoProfile -File tests/test-questionnaire-resume.ps1
          pwsh -NoProfile -File tests/test-questionnaire-network-failure.ps1
          pwsh -NoProfile -File tests/test-assistant-generation.ps1
          pwsh -NoProfile -File tests/test-web-package-readme-matches-contents.ps1
          pwsh -NoProfile -File tests/test-catalog-key-parity.ps1
          pwsh -NoProfile -File tests/test-questionnaire-update-mode.ps1
          pwsh -NoProfile -File tests/test-project-assistant-and-skills-links.ps1
          pwsh -NoProfile -File tests/test-prerequisites-e2e.ps1

  macos:
    name: macOS -- install.sh, full suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Mission 181. A participant's new Mac has Apple's /bin/bash 3.2 and
      # BSD tools, and nothing from Homebrew. The runner image puts
      # Homebrew's bash 5 and other non-Apple tools ahead of them, so this
      # job used to measure a developer's Mac: bash-4 and GNU-only
      # constructs passed here and broke -- or silently checked nothing --
      # on a participant's. From here on every step sees Apple's system
      # directories only, plus what a step installs for itself (uv), and the
      # next step proves it rather than assuming it. Chosen over pointing a
      # single `bash` at /bin/bash: that would still leave Homebrew's awk,
      # sed or xargs in front, and a hook or tool calls those too.
      - name: Apple's own tools only (what a new Mac ships)
        run: |
          echo "Runner PATH, before: $PATH"
          for t in bash awk sed grep find xargs date stat readlink realpath git python3 curl shasum; do
            printf '  %-9s %s\n' "$t" "$(command -v "$t" || echo '(none)')"
          done
          echo "PATH=/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      # Fails the job if the step above did not take, or if the shell a
      # participant gets would accept a bash-4 or GNU-only construct: the
      # three probes below must be REFUSED here, exactly as on a new Mac.
      - name: Proof -- Apple's bash 3.2 and BSD tools are the ones in use
        run: |
          echo "PATH=$PATH"
          fail=0
          case ":$PATH:" in
            *homebrew*|*:/usr/local/bin:*|*:/opt/*) echo "REFUS : a non-Apple directory is still on PATH"; fail=1 ;;
          esac
          for pair in bash:/bin/bash awk:/usr/bin/awk sed:/usr/bin/sed xargs:/usr/bin/xargs find:/usr/bin/find git:/usr/bin/git; do
            t="${pair%%:*}"; want="${pair#*:}"
            got="$(command -v "$t" || echo '(none)')"
            echo "  $t -> $got"
            [ "$got" = "$want" ] || { echo "REFUS : $t resolves to $got, not $want"; fail=1; }
          done
          bash --version | head -n 1
          bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ]' || { echo "REFUS : bash is not Apple's 3.x"; fail=1; }
          if bash -c 'declare -A probe=([a]=1)' 2>/dev/null; then
            echo "REFUS : this bash accepts declare -A -- a participant's does not"; fail=1
          fi
          if printf 'x\n' | awk 'ENDFILE { print "gawk" }' | grep -q gawk; then
            echo "REFUS : this awk runs ENDFILE -- a participant's does not"; fail=1
          fi
          if printf 'a\n' | xargs -d '\n' echo >/dev/null 2>&1; then
            echo "REFUS : this xargs accepts -d -- a participant's does not"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "PASS : Apple's bash 3.2, awk, sed, find and xargs are the ones every following step uses."

      - name: Guardians offline (session-preflight + .githooks/pre-commit)
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            UV_BIN="$RUNNER_TEMP/uv-bin"
            mkdir -p "$UV_BIN"
            export UV_UNMANAGED_INSTALL="$UV_BIN"
            export UV_NO_MODIFY_PATH=1
            export UV_SYSTEM_CERTS=1
            curl -fsSL -o "$RUNNER_TEMP/install-uv.sh" "https://astral.sh/uv/0.12.13/install.sh"
            HASH="$(shasum -a 256 "$RUNNER_TEMP/install-uv.sh" | awk '{print $1}')"
            if [ "$HASH" != "e7265962d703f3ca66b3e90fae8fcdc6d4e4b587027e9479ccc29b25c3f68d4e" ]; then
              echo "REFUS : hash uv installer inattendu : $HASH" >&2
              exit 1
            fi
            sh "$RUNNER_TEMP/install-uv.sh"
            export PATH="$UV_BIN:$PATH"
          fi
          bash tools/session-preflight.sh
          bash .githooks/pre-commit

      # Mission 181: CI used to call the guardians directly, never through
      # Git, so hooks tracked without their execute bit ran for no
      # participant on macOS or Linux and nothing here noticed. This one
      # commits in a fresh clone, the way a participant does.
      - name: Main -- a participant's commit runs the guardians (through Git)
        run: bash tests/test-githooks-run-on-commit.sh

      - name: Main -- participant path free of bash 4+ and GNU-only constructs
        run: bash tests/test-participant-shell-portability.sh

      # Mission 181, step 6 resumed: a root holding `&` or a backslash
      # reached two guardians mangled by sed; this sandbox proves it no
      # longer does (the backslash half runs where a name can hold one).
      - name: Main -- guardians read paths holding & or a backslash intact
        run: bash tests/test-guardian-path-special-chars.sh

      - name: Main install test -- answers file, second pass at empty porcelain
        run: bash tests/test-install-e2e.sh

      - name: Main -- nominal flow shows no atelier vocabulary (T21)
        run: bash tests/test-nominal-flow-no-atelier-vocabulary.sh

      - name: Secondary -- third-party licenses
        run: bash tests/test-third-party-licenses.sh

      - name: Secondary -- private patterns (P4), current tree
        run: bash tools/check-private-patterns.sh --tree-only

      - name: Secondary -- private patterns (P4), full history (informational, doubles the blocking tree check)
        continue-on-error: true
        run: bash tools/check-private-patterns.sh

  smoke-from-github:
    name: Smoke test -- real install line from GitHub
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    steps:
      # This job is the only one that reads the repository over the network
      # instead of the checkout: it clones the public URL a participant
      # would use, then runs the installer from that clone, in test mode,
      # never against the runner's own profile. It waits on the two jobs
      # above (needs:), so a tree that fails them never reaches this check.
      - name: Clone the published repository (real GitHub line, INSTALL.md)
        run: git clone https://github.com/businesshamiou/second-brain.git "$RUNNER_TEMP/second-brain-smoke"

      - name: Run the real installer line against the freshly cloned copy (test mode, never this runner's own profile)
        run: |
          bash "$RUNNER_TEMP/second-brain-smoke/install.sh" \
            --source "$RUNNER_TEMP/second-brain-smoke" \
            --answers-file "$RUNNER_TEMP/second-brain-smoke/tests/fixtures/install-answers.sample.json" \
            --test-mode --test-root "$RUNNER_TEMP/second-brain-smoke-testroot"
