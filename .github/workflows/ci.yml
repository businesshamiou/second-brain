name: Second Brain CI

# Mission 168, ticket 10. Windows and Ubuntu replay the installer on every
# push, chaining the main test (answers file, second pass at empty
# porcelain -- both asserted inside the same script) with the offline
# guardian suite and the secondary tests built by tickets 03-09. macOS runs
# on every push too: its minutes were billed x10 while the repository was
# private, and they are free now that it is public.
# A separate job plays the real, published install line from GitHub: the
# repository is public, so every job here runs on GitHub-hosted runners on
# each push. Since Mission 183-C01 a fifth job writes the acceptance report
# itself (eleven lines, S9 under a standard account) and keeps it as an
# artifact.
# Since Mission 188 no job lists tests or installs uv by hand: the suite is
# tests/suite.tsv, played by tests/run-suite.sh (tests/run-suite.ps1 on
# Windows) exactly as it is played locally, and every job sets up uv,
# Python and pre-commit through the cached action
# ./.github/actions/setup-test-env. What each test proves, and the Mission
# that brought it, is written next to it in the manifest.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Mission 189: the Windows suite (about 2,300 s of tests played one after
  # the other) is split into three shards run in parallel, balanced on the
  # durations measured in run 35349101214 (column "shard" of
  # tests/suite.tsv). fail-fast off: every shard runs to the end, and any red
  # shard turns the run red, as the single job did.
  windows:
    name: Windows -- suite, shard ${{ matrix.shard }}/3
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # uv pinned by tools/prerequisites.lock.json, into $RUNNER_TEMP, cached;
      # nothing on PATH, never the runner's profile paths.
      - uses: ./.github/actions/setup-test-env

      # Every Windows line of tests/suite.tsv, from a PowerShell parent as the
      # former powershell steps ran them, bash lines through Git's bash. All
      # lines run even after a red one; the summary names the red ones.
      - name: Suite -- tests/suite.tsv, Windows lines, shard ${{ matrix.shard }}/3
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-suite.ps1 -Shard "${{ matrix.shard }}/3"
          exit $LASTEXITCODE

  ubuntu:
    name: Ubuntu -- install.sh, full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-test-env

      # Every Ubuntu line of tests/suite.tsv, including the PowerShell tests
      # played under pwsh as informational (install.ps1 on Linux is a named
      # HYPOTHESIS, Mission 168 ticket 08).
      - name: Suite -- tests/suite.tsv, Ubuntu lines
        run: bash tests/run-suite.sh

  macos:
    name: macOS -- install.sh, full suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Mission 181. A participant's new Mac has Apple's /bin/bash 3.2 and
      # BSD tools, and nothing from Homebrew. The runner image puts
      # Homebrew's bash 5 and other non-Apple tools ahead of them, so this
      # job used to measure a developer's Mac: bash-4 and GNU-only
      # constructs passed here and broke -- or silently checked nothing --
      # on a participant's. From here on every step sees Apple's system
      # directories only, plus what the setup-test-env action installs under
      # $RUNNER_TEMP (uv, a managed Python, pre-commit), and the next step
      # proves it rather than assuming it. Chosen over pointing a
      # single `bash` at /bin/bash: that would still leave Homebrew's awk,
      # sed or xargs in front, and a hook or tool calls those too.
      - name: Apple's own tools only (what a new Mac ships)
        run: |
          echo "Runner PATH, before: $PATH"
          for t in bash awk sed grep find xargs date stat readlink realpath git python3 curl shasum; do
            printf '  %-9s %s\n' "$t" "$(command -v "$t" || echo '(none)')"
          done
          echo "PATH=/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      # Fails the job if the step above did not take, or if the shell a
      # participant gets would accept a bash-4 or GNU-only construct: the
      # three probes below must be REFUSED here, exactly as on a new Mac.
      - name: Proof -- Apple's bash 3.2 and BSD tools are the ones in use
        run: |
          echo "PATH=$PATH"
          fail=0
          case ":$PATH:" in
            *homebrew*|*:/usr/local/bin:*|*:/opt/*) echo "REFUS : a non-Apple directory is still on PATH"; fail=1 ;;
          esac
          for pair in bash:/bin/bash awk:/usr/bin/awk sed:/usr/bin/sed xargs:/usr/bin/xargs find:/usr/bin/find git:/usr/bin/git; do
            t="${pair%%:*}"; want="${pair#*:}"
            got="$(command -v "$t" || echo '(none)')"
            echo "  $t -> $got"
            [ "$got" = "$want" ] || { echo "REFUS : $t resolves to $got, not $want"; fail=1; }
          done
          bash --version | head -n 1
          bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ]' || { echo "REFUS : bash is not Apple's 3.x"; fail=1; }
          if bash -c 'declare -A probe=([a]=1)' 2>/dev/null; then
            echo "REFUS : this bash accepts declare -A -- a participant's does not"; fail=1
          fi
          if printf 'x\n' | awk 'ENDFILE { print "gawk" }' | grep -q gawk; then
            echo "REFUS : this awk runs ENDFILE -- a participant's does not"; fail=1
          fi
          if printf 'a\n' | xargs -d '\n' echo >/dev/null 2>&1; then
            echo "REFUS : this xargs accepts -d -- a participant's does not"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "PASS : Apple's bash 3.2, awk, sed, find and xargs are the ones every following step uses."

      # After the two steps above: the action runs with Apple's tools only.
      - uses: ./.github/actions/setup-test-env

      # Every macOS line of tests/suite.tsv, under Apple's bash 3.2.
      - name: Suite -- tests/suite.tsv, macOS lines
        run: bash tests/run-suite.sh

  smoke-from-github:
    name: Smoke test -- real install line from GitHub
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    steps:
      # This job is the only one that reads the repository over the network
      # instead of the checkout: it plays the published bootstrap line
      # (INSTALL.md, Mission 183-C01) straight from GitHub, pinned to the
      # commit under test, in test mode, never against the runner's own
      # profile. It waits on the two jobs above (needs:), so a tree that
      # fails them never reaches this check. The sample answers file is
      # fetched the same way, since nothing is cloned before the line runs.
      - name: Fetch the sample answers file from GitHub (nothing is cloned yet)
        run: curl -fsSL -o "$RUNNER_TEMP/answers.json" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/fixtures/install-answers.sample.json"

      - name: Run the published bootstrap line, pinned to this commit (test mode, never this runner's own profile)
        run: |
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          curl -fsSL "$RAW/bootstrap.sh" | bash -s -- \
            --ref "${{ github.sha }}" --raw-base "$RAW" \
            --answers-file "$RUNNER_TEMP/answers.json" \
            --test-mode --test-root "$RUNNER_TEMP/second-brain-smoke-testroot"

  acceptance-windows:
    name: Windows -- acceptance, 11 lines, S9 under a standard account
    # Mission 189: waits for the three Windows shards, like the smoke test.
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-test-env

      # Mission 183-C01, Decision 142112: the acceptance of a commit is the
      # dated report of tests/run-mechanical-acceptance.ps1. On this
      # throwaway runner S9 is played for real: a standard local account,
      # no Git on its PATH, the published bootstrap line pinned to this
      # commit, and a negative control (an administrator-only write must be
      # refused under that account). -RequireS9 makes anything but PASS
      # fail this job. S7 and S8 call a model: without provider credentials
      # they are reported SKIP, never PASS. The credentials are optional
      # repository secrets; when present, the provider CLIs are installed
      # here and the two lines are played for real.
      - name: Provider CLIs for S7/S8 (only when their secrets exist)
        shell: powershell
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ($env:ANTHROPIC_API_KEY) { npm install -g @anthropic-ai/claude-code }
          if ($env:OPENAI_API_KEY) { npm install -g @openai/codex }
          Write-Output "claude CLI: $([bool](Get-Command claude -ErrorAction SilentlyContinue)); codex CLI: $([bool](Get-Command codex -ErrorAction SilentlyContinue))"

      - name: Acceptance report (S1-S10, T21), S9 required
        shell: powershell
        env:
          SB_DISPOSABLE_MACHINE: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # uv comes from the setup-test-env action above, found where the
          # former inline install left it.
          if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $env:Path = "$env:RUNNER_TEMP\uv-bin;$env:Path"
          }
          $report = Join-Path $env:RUNNER_TEMP "second-brain-acceptance-${{ github.sha }}.md"
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-mechanical-acceptance.ps1 -Out $report -RequireS9
          $code = $LASTEXITCODE
          Get-Content $report
          exit $code

      - name: Keep the acceptance report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/second-brain-acceptance-${{ github.sha }}.md
          if-no-files-found: error
